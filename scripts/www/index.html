<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终极全功能科学计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft Yahei', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #1a2a6c, #b21f1f, #1a2a6c, #203a43);
            background-size: 400% 400%;
            animation: gradientBg 15s ease infinite;
        }

        @keyframes gradientBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .calculator {
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 480px;
        }

        .display {
            background: rgba(255,255,255,0.08);
            color: #fff;
            padding: 22px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: right;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            word-break: break-all;
        }

        .history {
            font-size: 16px;
            color: #b0c4de;
            min-height: 24px;
        }

        .result {
            font-size: 38px;
            font-weight: 500;
            color: #ffffff;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        button {
            padding: 16px 0;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
        }

        button:active {
            transform: translateY(0);
        }

        .num { background: #383e4a; color: #fff; }
        .op { background: #ff9500; color: #fff; }
        .func { background: #2979ff; color: #fff; }
        .clear { background: #ff3b30; color: #fff; }
        .equal { background: #4cd964; color: #fff; grid-row: span 2; }
        .zero { grid-column: span 2; }
        .lg-base { background: #9c27b0; color: #fff; }

        @media (max-width: 480px) {
            .calculator {
                max-width: 96%;
                padding: 15px;
            }
            .result {
                font-size: 30px;
            }
            button {
                padding: 12px 0;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="history" id="history"></div>
            <div class="result" id="result">0</div>
        </div>
        <div class="buttons">
            <button class="func" onclick="mathFunc('sin')">sin</button>
            <button class="func" onclick="mathFunc('cos')">cos</button>
            <button class="func" onclick="mathFunc('tan')">tan</button>
            <button class="func" onclick="inputFunc('ln')">ln</button>
            <button class="func" onclick="inputFunc('log10')">log₁₀</button>
            <button class="lg-base" onclick="openCustomLog()">logₐb</button>

            <button class="func" onclick="mathFunc('asin')">arcsin</button>
            <button class="func" onclick="mathFunc('acos')">arccos</button>
            <button class="func" onclick="mathFunc('atan')">arctan</button>
            <button class="func" onclick="inputFunc('sqrt')">√</button>
            <button class="func" onclick="inputFunc('square')">x²</button>
            <button class="func" onclick="inputFunc('pow')">xʸ</button>

            <button class="func" onclick="setConst('PI')">π</button>
            <button class="func" onclick="setConst('E')">e</button>
            <button class="clear" onclick="clearAll()">C</button>
            <button class="clear" onclick="backspace()">⌫</button>
            <button class="op" onclick="appendOp('/')">÷</button>
            <button class="equal" onclick="calculate()">=</button>

            <button class="num" onclick="appendNum('7')">7</button>
            <button class="num" onclick="appendNum('8')">8</button>
            <button class="num" onclick="appendNum('9')">9</button>
            <button class="func" onclick="inputFunc('1/x')">1/x</button>
            <button class="op" onclick="appendOp('*')">×</button>

            <button class="num" onclick="appendNum('4')">4</button>
            <button class="num" onclick="appendNum('5')">5</button>
            <button class="num" onclick="appendNum('6')">6</button>
            <button class="func" onclick="toggleSign()">±</button>
            <button class="op" onclick="appendOp('-')">-</button>

            <button class="num" onclick="appendNum('1')">1</button>
            <button class="num" onclick="appendNum('2')">2</button>
            <button class="num" onclick="appendNum('3')">3</button>
            <button class="func" onclick="inputFunc('abs')">|x|</button>
            <button class="op" onclick="appendOp('+')">+</button>

            <button class="num zero" onclick="appendNum('0')">0</button>
            <button class="num" onclick="appendNum('.')">.</button>
            <button class="func" onclick="inputFunc('floor')">取整</button>
            <button class="func" onclick="inputFunc('exp')">eˣ</button>
        </div>
    </div>

    <script>
        let current = '0';
        let prev = '';
        let operator = '';
        let funcFlag = false;
        let logBaseMode = false;
        let logBaseVal = 0;

        const resultEl = document.getElementById('result');
        const historyEl = document.getElementById('history');

        function updateDisplay() {
            resultEl.textContent = current;
        }

        function appendNum(num) {
            if (funcFlag) {
                current = num;
                funcFlag = false;
            } else {
                current = current === '0' ? num : current + num;
            }
            updateDisplay();
        }

        function appendOp(op) {
            prev = current;
            operator = op === '×' ? '*' : op === '÷' ? '/' : op;
            current = '0';
            historyEl.textContent = prev + ' ' + op;
        }

        function clearAll() {
            current = '0';
            prev = '';
            operator = '';
            funcFlag = false;
            logBaseMode = false;
            historyEl.textContent = '';
            updateDisplay();
        }

        function backspace() {
            current = current.length > 1 ? current.slice(0, -1) : '0';
            updateDisplay();
        }

        function toggleSign() {
            current = String(-parseFloat(current));
            updateDisplay();
        }

        function setConst(type) {
            if(type === 'PI') current = String(Math.PI);
            if(type === 'E') current = String(Math.E);
            funcFlag = true;
            updateDisplay();
        }

        function inputFunc(type) {
            let num = parseFloat(current);
            let res;
            switch(type) {
                case 'ln': res = Math.log(num); break;
                case 'log10': res = Math.log10(num); break;
                case 'sqrt': res = Math.sqrt(num); break;
                case 'square': res = num * num; break;
                case '1/x': res = 1 / num; break;
                case 'abs': res = Math.abs(num); break;
                case 'floor': res = Math.floor(num); break;
                case 'exp': res = Math.exp(num); break;
                case 'pow':
                    prev = current;
                    operator = '**';
                    funcFlag = true;
                    historyEl.textContent = prev + "^";
                    return;
            }
            current = fixResult(res);
            funcFlag = true;
            updateDisplay();
        }

        function mathFunc(type) {
            let num = parseFloat(current);
            let rad = num * Math.PI / 180;
            let res;
            switch(type) {
                case 'sin': res = Math.sin(rad); break;
                case 'cos': res = Math.cos(rad); break;
                case 'tan': res = Math.tan(rad); break;
                case 'asin': res = Math.asin(num) * 180 / Math.PI; break;
                case 'acos': res = Math.acos(num) * 180 / Math.PI; break;
                case 'atan': res = Math.atan(num) * 180 / Math.PI; break;
            }
            current = fixResult(res);
            funcFlag = true;
            updateDisplay();
        }

        function openCustomLog() {
            logBaseVal = parseFloat(current);
            logBaseMode = true;
            current = "0";
            historyEl.textContent = "log₍" + logBaseVal + "₎";
        }

        function calculate() {
            if(logBaseMode) {
                let num = parseFloat(current);
                let res = Math.log(num) / Math.log(logBaseVal);
                historyEl.textContent = "log("+logBaseVal+","+num+") =";
                current = fixResult(res);
                logBaseMode = false;
                updateDisplay();
                return;
            }

            if (!prev || !operator) return;
            try {
                let p = parseFloat(prev);
                let c = parseFloat(current);
                let res;
                switch(operator) {
                    case '+': res = p + c; break;
                    case '-': res = p - c; break;
                    case '*': res = p * c; break;
                    case '/': res = p / c; break;
                    case '**': res = Math.pow(p, c); break;
                }
                historyEl.textContent = prev + ' ' + operator + ' ' + current + ' =';
                current = fixResult(res);
                prev = '';
                operator = '';
            } catch(e) {
                current = '计算错误';
            }
            updateDisplay();
        }

        function fixResult(n) {
            return String(parseFloat(n.toFixed(10)));
        }

        document.addEventListener('keydown', e => {
            if(!isNaN(e.key)) appendNum(e.key);
            if(e.key === '.') appendNum('.');
            if(e.key === '+') appendOp('+');
            if(e.key === '-') appendOp('-');
            if(e.key === '*') appendOp('×');
            if(e.key === '/') appendOp('÷');
            if(e.key === 'Enter') calculate();
            if(e.key === 'Escape') clearAll();
            if(e.key === 'Backspace') backspace();
        });
    </script>
</body>
</html>
