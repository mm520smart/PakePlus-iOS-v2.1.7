<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>自由抽取器 - 手机适配版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-container {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }
        /* 面板通用 */
        .settings-panel, .draw-panel {
            background: rgba(30,35,45,0.7);
            border-radius: 24px;
            padding: 18px 16px;
            margin-bottom: 20px;
            backdrop-filter: blur(4px);
        }
        .panel-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #FFE6C7;
            border-left: 5px solid #F39C12;
            padding-left: 12px;
            margin-bottom: 16px;
        }
        /* 双栏在手机下变成上下排列 */
        .flex-row {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .option-editor, .option-batch {
            width: 100%;
        }
        textarea, input {
            width: 100%;
            background: #1e2a32;
            border: 1px solid #4a6272;
            border-radius: 16px;
            padding: 12px 14px;
            color: #f0f0f0;
            font-size: 1rem;
            resize: vertical;
            outline: none;
            transition: 0.2s;
            -webkit-appearance: none;
        }
        textarea:focus, input:focus {
            border-color: #F39C12;
            box-shadow: 0 0 0 2px rgba(243,156,18,0.3);
        }
        button {
            background: linear-gradient(135deg, #3a5e6e, #2c4858);
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-size: 0.9rem;
            min-height: 44px; /* 移动端增大点击区域 */
            -webkit-tap-highlight-color: transparent;
        }
        button.primary {
            background: linear-gradient(135deg, #F39C12, #E67E22);
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(243,156,18,0.3);
        }
        button.primary:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }
        button.danger {
            background: #862e2e;
        }
        button.warning {
            background: #b86f2c;
        }
        button:active {
            transform: translateY(1px);
        }
        /* 选项列表区域 */
        .items-list {
            background: #141e26;
            border-radius: 20px;
            padding: 12px;
            max-height: 280px;
            overflow-y: auto;
            margin-top: 16px;
        }
        .item-tag {
            background: #2a3b44;
            margin: 6px 6px 6px 0;
            padding: 8px 14px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: #f5f5f5;
            transition: 0.1s;
        }
        .item-tag span {
            max-width: 180px;
            word-break: break-word;
        }
        .del-btn {
            background: none;
            border: none;
            color: #ffaaaa;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 0 6px;
            box-shadow: none;
            line-height: 1;
            min-height: auto;
        }
        .del-btn:hover {
            color: #ff5e5e;
            transform: scale(1.1);
        }
        .result-card {
            background: #1f2e36;
            border-radius: 28px;
            padding: 24px 16px;
            text-align: center;
            margin: 16px 0;
            border: 1px solid #f39c1240;
        }
        .result-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #FFD966;
        }
        .result-content {
            font-size: 2rem;
            font-weight: 800;
            color: #FFE5B4;
            word-break: break-word;
            margin: 12px 0;
        }
        .check-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 12px 0 8px;
        }
        .history-info {
            font-size: 0.8rem;
            color: #bbd4e3;
            background: #00000033;
            border-radius: 40px;
            padding: 6px 14px;
            display: inline-block;
        }
        .empty-hint {
            color: #adccdd;
            text-align: center;
            padding: 24px 12px;
            font-style: italic;
        }
        /* 底部消息 */
        #drawMessage {
            font-size: 0.8rem;
            text-align: center;
            margin-top: 12px;
            color: #ffc285;
            min-height: 36px;
        }
        /* 滚动条优化 */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1e2a32;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #F39C12;
            border-radius: 10px;
        }
        /* 手机小屏幕额外优化 */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .app-container {
                padding: 12px;
            }
            .panel-title {
                font-size: 1.3rem;
            }
            .result-content {
                font-size: 1.6rem;
            }
            button {
                padding: 8px 16px;
                font-size: 0.85rem;
            }
            .item-tag {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- 设定区域 -->
    <div class="settings-panel">
        <div class="panel-title">设定抽取内容</div>
        <div class="flex-row">
            <div class="option-editor">
                <div style="margin-bottom: 8px; font-size:0.85rem; color:#ffde9e;">单个添加</div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="newItemInput" placeholder="例如：奶茶 / 散步 / 写代码" style="flex:2;">
                    <button id="addItemBtn" class="primary">+ 添加</button>
                </div>
                <div class="items-list" id="itemsListContainer">
                    <div class="empty-hint">暂无选项，请添加内容或批量导入</div>
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px;">
                    <button id="clearAllItemsBtn" class="danger">清空所有</button>
                </div>
            </div>
            <div class="option-batch">
                <div style="margin-bottom: 8px; font-size:0.85rem; color:#ffde9e;">批量导入 (每行一项)</div>
                <textarea id="batchItems" rows="4" placeholder="例如：&#10;跑步&#10;读书&#10;看电影&#10;学编程"></textarea>
                <button id="importBatchBtn" style="margin-top: 10px; width: 100%;">导入并替换</button>
                <div style="font-size:0.75rem; margin-top: 8px; color:#b9cedb;">也可使用预设示例</div>
                <button id="loadExampleBtn" style="margin-top: 4px; background:#355c6b;">加载示例选项</button>
            </div>
        </div>
    </div>

    <!-- 抽取区域 -->
    <div class="draw-panel">
        <div class="panel-title">随机抽取器</div>
        <div class="check-row">
            <label style="display: flex; align-items: center; gap: 8px; color:#FFE0A3; cursor: pointer;">
                <input type="checkbox" id="allowRepeatCheckbox" checked> 允许重复抽取
            </label>
            <button id="resetDrawHistoryBtn" style="background:#4d5e6b;">重置抽取记录</button>
            <span class="history-info" id="historyStatus">已抽取: 0 / 总数: 0</span>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-label">本次抽中</div>
            <div class="result-content" id="drawResult">—</div>
            <div style="margin-top: 15px;">
                <button id="drawBtn" class="primary" style="font-size:1.2rem; padding: 10px 28px;">随机抽取</button>
            </div>
        </div>
        <div id="drawMessage"></div>
    </div>
</div>

<script>
    // 核心状态
    let items = [];            // { id, text }
    let drawnIds = new Set();  // 已抽取过的id（仅在非重复模式下生效）
    let nextId = 1;

    // DOM 元素
    const itemsContainer = document.getElementById('itemsListContainer');
    const newItemInput = document.getElementById('newItemInput');
    const addBtn = document.getElementById('addItemBtn');
    const clearAllBtn = document.getElementById('clearAllItemsBtn');
    const batchTextarea = document.getElementById('batchItems');
    const importBtn = document.getElementById('importBatchBtn');
    const loadExampleBtn = document.getElementById('loadExampleBtn');
    const allowRepeatCheck = document.getElementById('allowRepeatCheckbox');
    const resetHistoryBtn = document.getElementById('resetDrawHistoryBtn');
    const drawBtn = document.getElementById('drawBtn');
    const drawResultSpan = document.getElementById('drawResult');
    const historyStatusSpan = document.getElementById('historyStatus');
    const drawMessageDiv = document.getElementById('drawMessage');

    // 本地存储
    function saveToLocalStorage() {
        const dataToStore = {
            items: items,
            drawnIds: drawnIds.size > 0 ? Array.from(drawnIds) : [],
            nextId: nextId
        };
        localStorage.setItem('randomPickerData', JSON.stringify(dataToStore));
    }

    function loadFromLocalStorage() {
        const raw = localStorage.getItem('randomPickerData');
        if (!raw) return false;
        try {
            const data = JSON.parse(raw);
            if (data.items && Array.isArray(data.items)) {
                items = data.items;
                nextId = data.nextId || (items.length ? Math.max(...items.map(i=>i.id), 0)+1 : 1);
                if (data.drawnIds && Array.isArray(data.drawnIds)) {
                    drawnIds = new Set(data.drawnIds);
                } else {
                    drawnIds.clear();
                }
                return true;
            }
        } catch(e) { console.warn(e); }
        return false;
    }

    // 刷新选项列表UI
    function renderItemsList() {
        if (!itemsContainer) return;
        if (items.length === 0) {
            itemsContainer.innerHTML = '<div class="empty-hint">暂无选项，请添加内容或批量导入</div>';
            updateHistoryInfo();
            drawMessageDiv.innerHTML = '';
            return;
        }
        const container = document.createElement('div');
        container.style.display = 'flex';
        container.style.flexWrap = 'wrap';
        container.style.gap = '8px';
        items.forEach(item => {
            const tag = document.createElement('div');
            tag.className = 'item-tag';
            const textSpan = document.createElement('span');
            textSpan.textContent = item.text;
            const delBtn = document.createElement('button');
            delBtn.textContent = 'x';
            delBtn.className = 'del-btn';
            delBtn.setAttribute('data-id', item.id);
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteItemById(item.id);
            });
            tag.appendChild(textSpan);
            tag.appendChild(delBtn);
            container.appendChild(tag);
        });
        itemsContainer.innerHTML = '';
        itemsContainer.appendChild(container);
        updateHistoryInfo();
    }

    function deleteItemById(id) {
        const itemExists = items.some(it => it.id === id);
        if (!itemExists) return;
        items = items.filter(it => it.id !== id);
        if (drawnIds.has(id)) drawnIds.delete(id);
        if (items.length === 0) drawnIds.clear();
        saveToLocalStorage();
        renderItemsList();
        // 如果当前显示的结果是被删除的项，清空结果
        const currentDisplay = drawResultSpan.innerText;
        const deletedText = items.find(it=>it.id===id)?.text;
        if (deletedText && currentDisplay === deletedText) {
            drawResultSpan.innerText = '—';
            drawMessageDiv.innerHTML = '';
        }
        updateHistoryInfo();
    }

    function addItem(text) {
        if (!text || text.trim() === '') return false;
        const trimmed = text.trim();
        if (items.some(item => item.text === trimmed)) {
            drawMessageDiv.innerHTML = '警告：选项已存在，未重复添加';
            return false;
        }
        const newItem = { id: nextId++, text: trimmed };
        items.push(newItem);
        saveToLocalStorage();
        renderItemsList();
        drawMessageDiv.innerHTML = '已添加: ' + escapeHtml(trimmed);
        setTimeout(() => { if(drawMessageDiv.innerHTML.includes('已添加')) drawMessageDiv.innerHTML = ''; }, 1500);
        return true;
    }

    function clearAllItems() {
        if (items.length === 0) return;
        if (confirm('确定清空所有选项吗？')) {
            items = [];
            drawnIds.clear();
            nextId = 1;
            saveToLocalStorage();
            renderItemsList();
            drawResultSpan.innerText = '—';
            drawMessageDiv.innerHTML = '所有选项已清空';
            setTimeout(() => drawMessageDiv.innerHTML = '', 1500);
        }
    }

    function importBatchReplace(textareaValue) {
        const lines = textareaValue.split(/\r?\n/);
        const newItems = [];
        for (let line of lines) {
            line = line.trim();
            if (line === '') continue;
            if (!newItems.some(i => i.text === line)) {
                newItems.push({ id: nextId++, text: line });
            }
        }
        if (newItems.length === 0) {
            drawMessageDiv.innerHTML = '批量导入失败：没有有效的非空行';
            return;
        }
        items = newItems;
        drawnIds.clear();
        saveToLocalStorage();
        renderItemsList();
        drawResultSpan.innerText = '—';
        drawMessageDiv.innerHTML = '批量导入成功，共 ' + items.length + ' 项';
        setTimeout(() => drawMessageDiv.innerHTML = '', 2000);
    }

    function loadExample() {
        const exampleList = ["跑步", "读书", "看电影", "学编程", "听音乐", "写日记"];
        const newItems = [];
        let newId = 1;
        for (let txt of exampleList) {
            newItems.push({ id: newId++, text: txt });
        }
        items = newItems;
        nextId = newId;
        drawnIds.clear();
        saveToLocalStorage();
        renderItemsList();
        drawResultSpan.innerText = '—';
        drawMessageDiv.innerHTML = '已加载示例选项 (6项)';
        setTimeout(() => drawMessageDiv.innerHTML = '', 1500);
    }

    function resetDrawHistory() {
        drawnIds.clear();
        saveToLocalStorage();
        updateHistoryInfo();
        drawMessageDiv.innerHTML = '抽取记录已重置，所有选项均可再次抽取';
        setTimeout(() => drawMessageDiv.innerHTML = '', 1500);
    }

    function updateHistoryInfo() {
        const total = items.length;
        let drawnCount = 0;
        if (!allowRepeatCheck.checked) {
            let validDrawn = 0;
            for (let id of drawnIds) {
                if (items.some(it => it.id === id)) validDrawn++;
            }
            drawnCount = validDrawn;
        } else {
            drawnCount = 0;
        }
        historyStatusSpan.innerText = `已抽取: ${drawnCount} / 总数: ${total}`;
        if (!allowRepeatCheck.checked && drawnCount === total && total > 0) {
            drawMessageDiv.innerHTML = '注意：所有选项都已抽取过，如需继续抽取请开启“允许重复”或重置记录。';
        } else if (drawMessageDiv.innerHTML.includes('所有选项都已抽取') && drawnCount !== total) {
            drawMessageDiv.innerHTML = '';
        }
    }

    function performDraw() {
        if (items.length === 0) {
            drawMessageDiv.innerHTML = '没有可抽取的选项，请先添加内容。';
            drawResultSpan.innerText = '—';
            return;
        }

        const allowRepeat = allowRepeatCheck.checked;
        let availableItems = [];
        if (!allowRepeat) {
            availableItems = items.filter(item => !drawnIds.has(item.id));
            if (availableItems.length === 0) {
                drawMessageDiv.innerHTML = '所有选项均已抽取，请打开“允许重复抽取”或点击“重置抽取记录”。';
                return;
            }
        } else {
            availableItems = [...items];
        }

        const randomIndex = Math.floor(Math.random() * availableItems.length);
        const selected = availableItems[randomIndex];

        drawResultSpan.innerText = selected.text;

        if (!allowRepeat) {
            drawnIds.add(selected.id);
            saveToLocalStorage();
        }
        updateHistoryInfo();
        drawMessageDiv.innerHTML = allowRepeat ? '抽取完成 (可重复模式)' : '抽取完成，此选项已标记';
        setTimeout(() => {
            if(drawMessageDiv.innerHTML === '抽取完成 (可重复模式)' || drawMessageDiv.innerHTML === '抽取完成，此选项已标记')
                drawMessageDiv.innerHTML = '';
        }, 1200);
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // 事件绑定
    addBtn.addEventListener('click', () => {
        const val = newItemInput.value;
        if (addItem(val)) newItemInput.value = '';
        newItemInput.focus();
    });
    newItemInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            const val = newItemInput.value;
            if (addItem(val)) newItemInput.value = '';
        }
    });
    clearAllBtn.addEventListener('click', clearAllItems);
    importBtn.addEventListener('click', () => {
        const raw = batchTextarea.value;
        if (!raw.trim()) {
            drawMessageDiv.innerHTML = '请先在文本框内填写内容 (每行一项)';
            return;
        }
        importBatchReplace(raw);
        batchTextarea.value = '';
    });
    loadExampleBtn.addEventListener('click', loadExample);
    resetHistoryBtn.addEventListener('click', resetDrawHistory);
    drawBtn.addEventListener('click', performDraw);
    allowRepeatCheck.addEventListener('change', () => {
        updateHistoryInfo();
        if (!allowRepeatCheck.checked) {
            const validIds = new Set(items.map(i => i.id));
            for (let id of drawnIds) {
                if (!validIds.has(id)) drawnIds.delete(id);
            }
            saveToLocalStorage();
            updateHistoryInfo();
        } else {
            updateHistoryInfo();
        }
    });

    // 初始化
    if (!loadFromLocalStorage()) {
        items = [];
        nextId = 1;
        drawnIds.clear();
    }
    renderItemsList();
    updateHistoryInfo();
</script>
</body>
</html>
